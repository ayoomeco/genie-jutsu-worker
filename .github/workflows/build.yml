name: build-and-push
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af; df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/genie-jutsu-worker:latest
            ghcr.io/${{ github.repository_owner }}/genie-jutsu-worker:v1-${{ github.sha }}
          provenance: false
      - name: Image size
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/genie-jutsu-worker:latest || true
